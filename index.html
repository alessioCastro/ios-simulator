  <button type="button" class="down scale" aria-label="Diminuir escala">-</button>

  <!-- O audio.mp3 não faz parte do repositório. Sem "src" não há requisição
       nem 404; para habilitar o som, adicione src="./audio.mp3" aqui. -->
  <audio preload="auto"></audio>

  <script>
    /* =========================
   FSM - ESTADOS DO SISTEMA
========================= */
    const STATES = {
      OFF: 'OFF',
      BOOTING: 'BOOTING',
      LOCKED_AWAKE: 'LOCKED_AWAKE',
      LOCKED_SLEEP: 'LOCKED_SLEEP',
      UNLOCKING: 'UNLOCKING',
      UNLOCKED: 'UNLOCKED'
    };

    let currentState = STATES.LOCKED_SLEEP;

    /* =========================
       ELEMENTOS
    ========================= */
    const powerButton = document.querySelector('.button.power');
    const volumeUpButton = document.querySelector('.button.vol-up');
    const volumeDownButton = document.querySelector('.button.vol-down');
    const volumeHud = document.querySelector('.volume-hud');
    const volumeLevel = document.querySelector('.volume-level');
    const bootScreen = document.querySelector('.boot-screen');
    const lockscreen = document.querySelector('.lockscreen');
    const lockscreenContent = document.querySelector('.lockscreen-content');
    const sleepScreen = document.querySelector('.sleep-screen');
    const phoneScreen = document.querySelector('.screen');
    const dynamicIsland = document.querySelector('.dynamic-island');
    const signalBarsIcon = document.querySelector('.signal-icon');
    const wifiSignalIcon = document.querySelector('.wifi-icon');
    const battery = document.querySelector('.battery');
    const home = document.querySelector('.home');
    const gestureBar = document.querySelector('.gesture-bar');
    const appContainer = document.querySelector('.app-container');
    const multitask = document.querySelector('.multitask');
    const appCards = document.querySelector('.app-cards');
    const audio = document.querySelector('audio');
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;

    /* Status bar e barra de gesto são únicos e compartilhados por todas as
       telas: são movidos entre contêineres, nunca duplicados. Centralizar a
       montagem aqui evita que fiquem presos dentro de uma tela oculta — era
       o que sumia com a barra de gesto na home (ela continuava dentro do
       app-container depois de fechar um app). */
    function mountStatusBar(host) {
      if (dynamicIsland.parentElement !== host) {
        host.insertBefore(dynamicIsland, host.firstChild);
      }
    }

    function mountGestureBar(host) {
      if (gestureBar.parentElement !== host) {
        host.appendChild(gestureBar);
      }
    }

    /* Timer do "aparece e some" da barra ao abrir um app. Guardado aqui para
       poder ser cancelado quando outro fluxo (gesto, alternador) assume o
       controle da barra — antes ele era anônimo e apagava a barra já dentro
       do alternador de tarefas. */
    let gestureBarAutoHideTimer = null;

    function hideGestureBarNow() {
      clearTimeout(gestureBarAutoHideTimer);
      clearTimeout(gestureBarHideTimer);
      gestureBar.classList.remove('active', 'pull');
      gestureBar.classList.add('hidden');
    }

    let volume = 50;
    let audioCtx = null;
    let audioGain = null;

    function applyVolume() {
      if (audioGain) audioGain.gain.value = volume * 0.01;
    }

    /* O contexto só pode ser criado/retomado a partir de um gesto do usuário.
       Antes ele era criado no load (fica suspenso) e o audio.play() rejeitava
       sem tratamento — o erro estourava no console. */
    function initAudio() {
      if (audioCtx || !AudioContextClass) return;

      try {
        audioCtx = new AudioContextClass();
        audioGain = audioCtx.createGain();
        audioCtx.createMediaElementSource(audio)
          .connect(audioGain)
          .connect(audioCtx.destination);

        applyVolume();
      } catch (err) {
        console.warn('Áudio indisponível:', err);
        audioCtx = null;
        audioGain = null;
      }
    }

    async function startAudio() {
      initAudio();
      if (!audioCtx) return;

      try {
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        applyVolume();

        if (audio.paused) await audio.play();
      } catch (err) {
        // autoplay bloqueado ou audio.mp3 ausente: o mockup segue funcionando sem som
      }
    }

    /* =========================
       FSM CORE
    ========================= */
    const TRANSITIONS = {
      OFF: [STATES.BOOTING],
      BOOTING: [STATES.LOCKED_AWAKE, STATES.OFF], // OFF: bateria zerada durante o boot
      LOCKED_AWAKE: [STATES.LOCKED_SLEEP, STATES.UNLOCKING, STATES.OFF],
      LOCKED_SLEEP: [STATES.LOCKED_AWAKE, STATES.OFF],
      // OFF: bateria zerada durante a animação de desbloqueio
      UNLOCKING: [STATES.UNLOCKED, STATES.OFF],
      UNLOCKED: [STATES.LOCKED_SLEEP, STATES.OFF]
    };

    function transition(to) {
      if (currentState === to) return;

      // o estado OFF era inalcançável: nenhum estado aceitava ir para ele,
      // então a bateria em 0 não desligava nada e o long press nunca fazia sentido
      const allowed = TRANSITIONS[currentState] || [];

      if (!allowed.includes(to)) {
        console.warn(`FSM: transição inválida ${currentState} → ${to}`);
        return;
      }

      exitState(currentState);
      currentState = to;
      enterState(to);
    }

    /* =========================
       RESET DO APP ABERTO
    ========================= */
    function resetAppView() {
      appContainer.classList.remove('active');
      appContainer.classList.add('hidden');

      // sem app na frente, a home volta a ser clicável/focável e o app não
      // guarda o transform inline de um arrasto interrompido
      home.inert = false;
      resetAppDrag();
    }

    /* =========================
       EXIT STATE
    ========================= */
    function exitState(state) {
      switch (state) {

        case STATES.BOOTING:
          // boot interrompido (ex.: bateria zerada): não deixa a sequência solta
          clearBootTimers();
          break;

        case STATES.UNLOCKING:
          // desbloqueio interrompido (ex.: bateria zerada): cancela o timer
          // que chamaria transition(UNLOCKED) depois, a partir de OFF
          clearTimeout(unlockTimer);
          unlockTimer = null;
          break;

        case STATES.LOCKED_AWAKE:
          lockscreenContent.style.transition = '';
          lockscreenContent.style.transform = '';
          break;

        case STATES.UNLOCKED:
          resetAppView();
          if (typeof resetMultitask === 'function') resetMultitask();
          home.classList.remove('active');
          home.classList.add('hidden');
          hideGestureBarNow();
          break;

      }
    }

    /* =========================
       ENTER STATE
    ========================= */
    function enterState(state) {
      switch (state) {

        case STATES.BOOTING:
          boot();
          break;

        case STATES.LOCKED_AWAKE:
          // 1. Apaga tela de sleep IMEDIATAMENTE
          sleepScreen.classList.remove('active');
          sleepScreen.classList.add('hidden');

          // 2. Garante que home/app/multitarefa não estejam visíveis
          resetAppView();
          if (typeof resetMultitask === 'function') resetMultitask();
          home.classList.remove('active');
          home.classList.add('hidden');

          // 3. Restaura lockscreen
          lockscreen.classList.remove('hidden');
          lockscreenContent.style.transition = 'none';
          lockscreenContent.style.transform = 'translateY(0)';

          dynamicIsland.classList.remove('hidden');
          gestureBar.classList.remove('hidden');

          requestAnimationFrame(() => {
            dynamicIsland.classList.add('active');
            lockscreen.classList.add('active');
            // showGestureBar (e não classes soltas): cancela um hide pendente
            // do gesto, que apagaria a barra já na tela de bloqueio
            showGestureBar();
            mountGestureBar(lockscreenContent);
            mountStatusBar(lockscreenContent);
          });
          break;

        case STATES.LOCKED_SLEEP:
          dynamicIsland.classList.remove('active');
          sleepScreen.classList.remove('hidden');
          requestAnimationFrame(() => {
            dynamicIsland.classList.add('hidden');
            sleepScreen.classList.add('active');
          });
          break;

        case STATES.UNLOCKING:
          lockscreenContent.style.transition =
            'transform 0.35s cubic-bezier(.2,.6,.3,1)';
          lockscreenContent.style.transform = 'translateY(-100%)';

          clearTimeout(unlockTimer);
          unlockTimer = setTimeout(() => {
            transition(STATES.UNLOCKED);
          }, 400);
          break;

        case STATES.UNLOCKED:
          lockscreen.classList.add('hidden');
          lockscreen.classList.remove('active');

          // garante que nenhum app/multitarefa fique "preso" por cima da home
          resetAppView();
          if (typeof resetMultitask === 'function') resetMultitask();

          home.classList.remove('hidden');

          dynamicIsland.classList.add('active');
          dynamicIsland.classList.remove('hidden');
          mountStatusBar(home);
          mountGestureBar(home);
          hideGestureBarNow();
          requestAnimationFrame(() => {
            home.classList.add('active');
          });
          break;

        case STATES.OFF:
          resetAppView();
          if (typeof resetMultitask === 'function') resetMultitask();

          lockscreen.classList.remove('active');
          lockscreen.classList.add('hidden');
          home.classList.remove('active');
          home.classList.add('hidden');
          bootScreen.classList.remove('active');
          bootScreen.classList.add('hidden');
          sleepScreen.classList.remove('active');
          sleepScreen.classList.add('hidden');
          dynamicIsland.classList.remove('active');
          dynamicIsland.classList.add('hidden');
          hideGestureBarNow();
          volumeHud.classList.remove('active');
          volumeHud.classList.add('hidden');
          lockscreenContent.style.transition = '';
          lockscreenContent.style.transform = '';
          break;
      }
    }

    /* =========================
       BOOT
    ========================= */
    /* Timers da sequência de boot. Se o aparelho sair de BOOTING no meio
       (ex.: bateria zerada), eles são cancelados — senão o boot abandonado
       termina depois e tenta chamar transition(LOCKED_AWAKE) a partir de OFF,
       que é uma aresta inválida. */
    let bootTimers = [];
    let unlockTimer = null;

    function clearBootTimers() {
      bootTimers.forEach(clearTimeout);
      bootTimers = [];
    }

    function boot() {
      clearBootTimers();
      bootScreen.classList.remove('hidden');

      bootTimers.push(setTimeout(() => {
        bootScreen.classList.add('active');
      }, 200));

      bootTimers.push(setTimeout(() => {
        bootScreen.classList.remove('active');

        bootTimers.push(setTimeout(() => {
          bootScreen.classList.add('hidden');
          transition(STATES.LOCKED_AWAKE);
        }, 1200));

      }, 4200));
    }

    /* =========================
       POWER BUTTON (POINTER)
    ========================= */
    let pressTimer = null;
    let isPressing = false;

    powerButton.addEventListener('pointerdown', onPowerPressStart);
    powerButton.addEventListener('pointerup', onPowerPressEnd);
    powerButton.addEventListener('pointercancel', resetPowerPress);
    // se o navegador perder a captura do ponteiro, libera o botão
    powerButton.addEventListener('lostpointercapture', resetPowerPress);

    // Enter/Espaço num <button> geram click com detail 0 (sem pointer):
    // mapeia para toque curto, preservando o comportamento do ponteiro
    powerButton.addEventListener('click', e => {
      if (e.detail !== 0) return;

      // no teclado o toque curto não liga (no OFF ele é inerte por design),
      // então sem isso a bateria zerada deixava o mockup num preto definitivo
      if (currentState === STATES.OFF) {
        transition(STATES.BOOTING);
        return;
      }

      onPowerShortPress();
    });

    function onPowerPressStart(e) {
      if (isPressing) return;
      isPressing = true;

      // captura o ponteiro: sem isso, soltar o mouse fora do botão deixava
      // isPressing travado em true e o botão parava de responder
      if (e && e.pointerId !== undefined) {
        try {
          powerButton.setPointerCapture(e.pointerId);
        } catch (err) { /* ignore */ }
      }

      pressTimer = setTimeout(() => {
        pressTimer = null;
        onPowerLongPress();
      }, 800);

      // não bloqueia o fluxo do clique; falhas de autoplay são ignoradas
      startAudio();
    }

    function onPowerPressEnd() {
      if (!isPressing) return;

      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
        onPowerShortPress();
      }

      isPressing = false;
    }

    function resetPowerPress() {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      isPressing = false;
    }

    function onPowerLongPress() {
      if (currentState === STATES.OFF) {
        // aparelho desligado → liga
        transition(STATES.BOOTING);
      } else if (
        currentState === STATES.LOCKED_AWAKE ||
        currentState === STATES.LOCKED_SLEEP ||
        currentState === STATES.UNLOCKED
      ) {
        // aparelho ligado → desliga (torna o estado OFF alcançável)
        transition(STATES.OFF);
      }
    }

    function onPowerShortPress() {
      if (currentState === STATES.LOCKED_AWAKE) {
        transition(STATES.LOCKED_SLEEP);
      } else if (currentState === STATES.LOCKED_SLEEP) {
        transition(STATES.LOCKED_AWAKE);
      } else if (currentState === STATES.UNLOCKED) {
        transition(STATES.LOCKED_SLEEP);
      }
    }

    /* O desbloqueio existia só como arrasto de dedo: quem usa teclado acordava
       o aparelho (Enter no botão lateral) e ficava preso na tela de bloqueio,
       sem acesso a nada. Seta para cima desbloqueia de qualquer lugar;
       Enter/Espaço também, exceto quando o foco está num botão (aí a intenção
       é ativar aquele botão, não desbloquear). */
    document.addEventListener('keydown', e => {
      if (currentState !== STATES.LOCKED_AWAKE) return;

      if (e.key === 'ArrowUp') {
        e.preventDefault();
        transition(STATES.UNLOCKING);
        return;
      }

      if (e.key !== 'Enter' && e.key !== ' ') return;

      if (e.target instanceof Element && e.target.closest('button, [role="button"]')) return;

      e.preventDefault();
      transition(STATES.UNLOCKING);
    });

    /* =========================
       SWIPE UP (LOCKSCREEN)
    ========================= */
    let startY = 0;
    let currentY = 0;
    let isDragging = false;
    let swipeScreenHeight = 0;

    /* Limiares em fração da altura da tela, não em px do ponteiro: o aparelho
       é desenhado com transform: scale(--scale), então o mesmo arrasto encolhe
       junto com o mockup. 0.475 reproduz os 380px originais na escala padrão
       0.9 (tela de 799px), e continua proporcional em qualquer zoom. */
    const UNLOCK_SWIPE_RATIO = 0.475;

    // altura visível do aparelho (já escalada) — base do limiar de desbloqueio
    function screenHeightPx() {
      return phoneScreen.getBoundingClientRect().height || 1;
    }

    lockscreen.addEventListener('pointerdown', swipeStart);
    lockscreen.addEventListener('pointermove', swipeMove);
    lockscreen.addEventListener('pointerup', swipeEnd);
    lockscreen.addEventListener('pointercancel', swipeCancel);

    function swipeStart(e) {
      if (currentState !== STATES.LOCKED_AWAKE) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return; // botão direito não desbloqueia

      isDragging = true;
      startY = e.clientY;
      currentY = startY;
      swipeScreenHeight = screenHeightPx();

      lockscreenContent.style.transition = 'none';
      try {
        lockscreen.setPointerCapture(e.pointerId); // ESSENCIAL no desktop
      } catch (err) { /* captura indisponível: o arrasto continua pelo bubbling */ }
    }

    function swipeMove(e) {
      if (!isDragging) return;
      if (currentState !== STATES.LOCKED_AWAKE) return;

      currentY = e.clientY;
      const delta = currentY - startY;

      if (delta > 0) return;

      lockscreenContent.style.transform = `translateY(${delta}px)`;
    }

    function swipeEnd(e) {
      if (!isDragging) return;

      isDragging = false;

      if (lockscreen.hasPointerCapture(e.pointerId)) {
        lockscreen.releasePointerCapture(e.pointerId);
      }

      if (currentState !== STATES.LOCKED_AWAKE) return;

      const delta = currentY - startY;

      lockscreenContent.style.transition =
        'transform 0.35s cubic-bezier(.2,.6,.3,1)';

      if (delta < -(UNLOCK_SWIPE_RATIO * swipeScreenHeight)) {
        transition(STATES.UNLOCKING);
      } else {
        lockscreenContent.style.transform = 'translateY(0)';
      }
    }

    function swipeCancel(e) {
      if (!isDragging) return;

      isDragging = false;

      if (e && lockscreen.hasPointerCapture(e.pointerId)) {
        lockscreen.releasePointerCapture(e.pointerId);
      }

      lockscreenContent.style.transition = 'transform 0.3s ease';
      lockscreenContent.style.transform = 'translateY(0)';
    }

  </script>

  <script>
    /* =========================
   LOCKSCREEN TIME
========================= */
    const timeEl = document.querySelector('.lockscreen-time');
    const dateEl = document.querySelector('.lockscreen-date');

    function updateTime() {
      const now = new Date();

      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');

      const weekday = now
        .toLocaleDateString('pt-BR', { weekday: 'short' })
        .replace('.', '');

      const month = now
        .toLocaleDateString('pt-BR', { month: 'short' })
        .replace('.', '');

      const day = now.getDate();

      const formattedWeekday =
        weekday[0].toUpperCase() + weekday.slice(1) + '.';

      const formattedMonth = month.toLowerCase() + '.';

      timeEl.textContent = `${hours}:${minutes}`;
      dateEl.textContent = `${formattedWeekday} ${day} de ${formattedMonth}`;
    }

    // inicial
    updateTime();

    // atualiza só quando faz sentido (1x/min)
    setInterval(updateTime, 60000);
  </script>

  <script>
    let volumeTimeout = null;

    function showVolumeHud() {
      volumeLevel.style.height = `${volume}%`;

      volumeHud.classList.remove('hidden');
      volumeHud.classList.add('active');

      clearTimeout(volumeTimeout);
      volumeTimeout = setTimeout(() => {
        volumeHud.classList.remove('active');
        volumeTimeout = setTimeout(() => {
          volumeHud.classList.add('hidden');
        }, 250);
      }, 1200);
    }

    function volumeUp() {
      if (currentState === STATES.LOCKED_SLEEP || currentState === STATES.OFF) return;
      volume = Math.min(100, volume + 5);
      showVolumeHud();

      applyVolume();
    }

    function volumeDown() {
      if (currentState === STATES.LOCKED_SLEEP || currentState === STATES.OFF) return;
      volume = Math.max(0, volume - 5);
      showVolumeHud();

      applyVolume();
    }

    volumeUpButton.addEventListener('click', volumeUp);
    volumeDownButton.addEventListener('click', volumeDown);

  <script>
    const apps = document.querySelectorAll('.app');
    const appTitle = document.querySelector('.app-title');

    // ícone que abriu o app atual: o foco volta para ele ao fechar
    let lastFocusedTile = null;

    function openApp(name) {
      if (currentState !== STATES.UNLOCKED) return;

      if (multitaskActive) closeMultitask();

      appTitle.textContent = name;

      const focused = document.activeElement;
      lastFocusedTile = focused && focused.classList && focused.classList.contains('app') ? focused : null;

      home.classList.remove('active');
      // a home fica visível por baixo (fade), mas sem foco, clique ou leitura
      // por leitor de tela enquanto o app está na frente
      home.inert = true;

      appContainer.classList.remove('hidden');
      requestAnimationFrame(() => {
        // o closeApp de um app anterior pode ter escondido o contêiner entre
        // este remove e o rAF; sem isto o app abria em display:none
        appContainer.classList.remove('hidden');
        appContainer.classList.add('active');

        // status bar e barra de gesto também visíveis dentro do app
        mountStatusBar(appContainer);
        mountGestureBar(appContainer);

        gestureBar.classList.remove('hidden');
        gestureBar.classList.add('active');

        clearTimeout(gestureBarAutoHideTimer);
        gestureBarAutoHideTimer = setTimeout(() => {
          gestureBar.classList.add('hidden');
          gestureBar.classList.remove('active');
        }, 1000);
      });

      if (!openApps.includes(name)) {
        openApps.push(name);
      }
    }

    function closeApp() {
      // devolve a status bar e a barra de gesto para a home
      mountStatusBar(home);
      mountGestureBar(home);
      hideGestureBarNow();

      home.inert = false;

      // o foco era perdido no body ao abrir o app (a home fica inert):
      // devolve para o ícone de origem, senão o teclado recomeça do topo
      if (lastFocusedTile && document.contains(lastFocusedTile)) {
        lastFocusedTile.focus({ preventScroll: true });
      }
      lastFocusedTile = null;

      // anima o app "encolhendo" em direção ao ícone antes de esconder
      appContainer.classList.remove('active');
      setTimeout(() => {
        if (appContainer.classList.contains('active')) return;
        appContainer.classList.add('hidden');
        appContainer.style.transform = '';
        appContainer.style.opacity = '';
        appContainer.style.transition = '';
      }, 360);

      if (currentState === STATES.UNLOCKED) {
        home.classList.remove('hidden');
        home.classList.add('active');
      }
    }

    apps.forEach(app => {
      app.addEventListener('click', () => {
        openApp(app.dataset.app);
      });
    });
  </script>

  <script>
    /* =========================
       GESTO DA BARRA INFERIOR (iOS)
       - deslizar para cima e soltar rápido  → fecha o app (volta pra home)
       - deslizar para cima e pausar         → alternador de tarefas
       Segurar parado NÃO abre o alternador (isso não existe no iOS).
    ========================= */
    /* Frações da altura da tela: independem do zoom (--scale) e reproduzem os
       px originais na escala padrão 0.9 (tela de 799px). */
    const BAR_ZONE_RATIO = 0.05;      // ~40px: faixa inferior que inicia o gesto
    const SWIPE_CLOSE_RATIO = 0.075;  // ~60px para cima confirmam o fechamento
    const DRAG_PROGRESS_RATIO = 0.4;  // ~320px: curso completo do encolhimento
    const SWIPE_PAUSE_MS = 220;       // pausa após subir que abre o alternador
    const CARD_SWIPE_RATIO = 0.21;    // ~80px no card de 378px: fecha o card no alternador

    let gestureStartY = 0;
    let gestureActive = false;
    let gestureScreenHeight = 0;
    let gestureHoldTimer = null;
    let gestureOpenedMultitask = false;
    let gestureMoved = false;

    function showGestureBar() {
      // os dois timers disputam a barra: um "mostrar" cancela a ocultação
      // pendente do gesto e o auto-hide de abertura de app
      clearTimeout(gestureBarAutoHideTimer);
      clearTimeout(gestureBarHideTimer);
      gestureBar.classList.remove('hidden');
      gestureBar.classList.add('active');
    }

    function hideGestureBar(delay = 0) {
      clearTimeout(gestureBarAutoHideTimer);
      clearTimeout(gestureBarHideTimer);
      gestureBarHideTimer = setTimeout(() => {
        if (gestureActive) return;
        gestureBar.classList.remove('active', 'pull');
        gestureBar.classList.add('hidden');
      }, delay);
    }

    let gestureBarHideTimer = null;

    function resetAppDrag() {
      appContainer.style.transition = '';
      appContainer.style.transform = '';
      appContainer.style.opacity = '';
    }

    phoneScreen.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (currentState !== STATES.UNLOCKED) return;
      if (multitaskActive) return; // o overlay do multitarefa está por cima

      const y = e.clientY;
      const rect = phoneScreen.getBoundingClientRect();

      if (y <= rect.bottom - rect.height * BAR_ZONE_RATIO) return; // fora da zona da barra inferior

      gestureScreenHeight = rect.height || 1;
      gestureStartY = y;
      gestureActive = true;
      gestureMoved = false;
      gestureOpenedMultitask = false;

      showGestureBar();

      // o app acompanha o dedo sem transição
      appContainer.style.transition = 'none';

      try {
        phoneScreen.setPointerCapture(e.pointerId); // ESSENCIAL no desktop
      } catch (err) { /* captura indisponível: o arrasto continua pelo bubbling */ }
    });

    phoneScreen.addEventListener('pointermove', e => {
      if (!gestureActive) return;
      if (currentState !== STATES.UNLOCKED) return; // ex.: power durante o arrasto
      if (e.pointerType === 'mouse' && e.buttons !== 1) return;

      const delta = e.clientY - gestureStartY;
      if (delta >= 0) return; // só interessa arrastar para cima

      const up = -delta;

      if (up > 8) {
        gestureMoved = true;
        gestureBar.classList.add('pull');
      }

      // app encolhendo em direção ao ícone, seguindo o dedo
      if (appContainer.classList.contains('active')) {
        const progress = Math.min(1, up / (DRAG_PROGRESS_RATIO * gestureScreenHeight));
        appContainer.style.transform =
          `translateY(${-up * 0.25}px) scale(${1 - 0.12 * progress})`;
        appContainer.style.opacity = String(1 - 0.2 * progress);
      }

      // subiu e pausou → alternador de tarefas (também na tela inicial)
      if (gestureMoved && !gestureOpenedMultitask) {
        clearTimeout(gestureHoldTimer);
        gestureHoldTimer = setTimeout(() => {
          if (!gestureActive) return;

          gestureOpenedMultitask = true;
          openMultitask();
        }, SWIPE_PAUSE_MS);
      }
    });

    phoneScreen.addEventListener('pointerup', e => {
      if (!gestureActive) return;

      clearTimeout(gestureHoldTimer);
      gestureBar.classList.remove('pull');
      gestureActive = false;

      if (phoneScreen.hasPointerCapture(e.pointerId)) {
        phoneScreen.releasePointerCapture(e.pointerId);
      }

      const delta = e.clientY - gestureStartY;
      const appWasOpen = appContainer.classList.contains('active');

      // devolve o controle da animação ao CSS
      resetAppDrag();

      if (gestureOpenedMultitask) return;

      // swipe rápido para cima → fecha o app
      if (appWasOpen && delta < -(SWIPE_CLOSE_RATIO * gestureScreenHeight)) {
        closeApp();
        return;
      }

      hideGestureBar(600);
    });

    phoneScreen.addEventListener('pointercancel', () => {
      clearTimeout(gestureHoldTimer);
      gestureBar.classList.remove('pull');
      gestureActive = false;
      resetAppDrag();
      hideGestureBar(600);
    });

  </script>

  <script>
    let openApps = [];
    let multitaskActive = false;

    function openMultitask() {
      if (currentState !== STATES.UNLOCKED) return;
      if (multitaskActive) return;

      multitaskActive = true;
      renderMultitask();

      // o alternador cobre a home: os ícones atrás não podem receber foco
      home.inert = true;

      // status bar e barra de gesto visíveis também no alternador
      mountStatusBar(multitask);
      mountGestureBar(multitask);
      showGestureBar(); // no iOS a barra continua visível no alternador

      multitask.classList.remove('hidden');
      requestAnimationFrame(() => {
        multitask.classList.add('active');
      });
    }

    function closeMultitask() {
      if (!multitaskActive) return;

      multitaskActive = false;
      multitask.classList.remove('active');

      // devolve status bar e barra de gesto para o app (se aberto) ou a home
      const host = appContainer.classList.contains('active') ? appContainer : home;
      mountStatusBar(host);
      mountGestureBar(host);

      // a home só volta a aceitar foco se não houver app na frente
      home.inert = appContainer.classList.contains('active');

      // na home a barra só aparece durante o gesto; sem isso ela ficava
      // visível para sempre depois de fechar o alternador
      if (host === home) {
        hideGestureBarNow();
      } else {
        hideGestureBar(600); // volta ao mesmo estado de um app aberto
      }

      setTimeout(() => {
        if (!multitaskActive) multitask.classList.add('hidden');
      }, 300);
    }

    // usado pelo FSM ao bloquear/desligar o aparelho
    function resetMultitask() {
      multitaskActive = false;
      multitask.classList.remove('active');
      multitask.classList.add('hidden');
      appCards.innerHTML = '';
      // a barra de gesto também volta à home: deixá-la dentro do alternador
      // oculto furava o modelo de "dono" da barra
      mountStatusBar(home);
      mountGestureBar(home);
      hideGestureBarNow();
    }

    // antes não havia como fechar o multitarefa sem abrir um app:
    // tocar no fundo (ou ESC) agora fecha
    multitask.addEventListener('click', e => {
      if (!e.target.closest('.app-card')) closeMultitask();
    });

    // Enter/Espaço nos cards do alternador
    appCards.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;

      const card = e.target.closest('.app-card');
      if (!card) return;

      e.preventDefault();
      card.click();
    });

    // o alternador rola na horizontal; sem isso um mouse comum (sem wheel
    // horizontal) só alcançava os primeiros cards
    appCards.addEventListener('wheel', e => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;

      e.preventDefault();

      // Firefox entrega deltaY em linhas (deltaMode 1), não em pixels
      const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? appCards.clientWidth : 1;
      appCards.scrollLeft += e.deltaY * unit;
    }, { passive: false });

    document.addEventListener('keydown', e => {
      // sem gesto de dedo, a seta para cima na home abre o alternador
      if (e.key === 'ArrowUp' && currentState === STATES.UNLOCKED && !multitaskActive &&
        !appContainer.classList.contains('active')) {
        e.preventDefault();
        openMultitask();
        return;
      }

      if (e.key !== 'Escape') return;

      if (multitaskActive) {
        closeMultitask();
      } else if (appContainer.classList.contains('active')) {
        // equivalente ao gesto de subir: quem está no teclado não ficava
        // preso dentro do app
        closeApp();
      }
    });

    function renderMultitask() {
      appCards.innerHTML = '';

      openApps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'app-card';
        card.textContent = app;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', app);
        card.tabIndex = 0;

        // evita que o "swipe para cima" (fechar card) dispare também o clique,
        // que reabria o app que acabou de ser fechado
        let swiped = false;
        let dragging = false;
        let dragStartY = 0;

        card.addEventListener('click', () => {
          if (swiped) {
            swiped = false;
            return;
          }

          closeMultitask();
          openApp(app);
        });

        /* Um handler só para os dois desfechos do arrasto: antes o pointerup
           ficava registrado para sempre quando o navegador cancelava o gesto
           (pointercancel), e o próximo toque era lido com a posição antiga. */
        function endCardDrag(ev, cancelled) {
          if (!dragging) return;

          dragging = false;
          card.removeEventListener('pointerup', onCardUp);
          card.removeEventListener('pointercancel', onCardCancel);

          if (cancelled) {
            swiped = false;
            return;
          }

          const delta = ev.clientY - dragStartY;
          const threshold = CARD_SWIPE_RATIO * card.getBoundingClientRect().height;

          if (delta < -threshold) {
            swiped = true;
            closeAppFromMultitask(app, card);
          }
        }

        function onCardUp(ev) {
          endCardDrag(ev, false);
        }

        function onCardCancel() {
          endCardDrag(null, true);
        }

        card.addEventListener('pointerdown', e => {
          if (e.pointerType === 'mouse' && e.button !== 0) return;

          dragging = true;
          swiped = false;
          dragStartY = e.clientY;

          try {
            card.setPointerCapture(e.pointerId);
          } catch (err) { /* ignore */ }

          card.addEventListener('pointerup', onCardUp);
          card.addEventListener('pointercancel', onCardCancel);
        });

        appCards.appendChild(card);
      });
    }

    function closeAppFromMultitask(app, card) {
      openApps = openApps.filter(a => a !== app);
      card.style.opacity = '0';
      card.style.transform = 'translateY(-100px)';

      // fechar o card do app que está na frente devolve a home por baixo do
      // alternador (no iOS o app fechado não reaparece ao dispensar o seletor)
      if (app === appTitle.textContent && appContainer.classList.contains('active')) {
        closeApp();

        if (multitaskActive) {
          mountStatusBar(multitask);
          mountGestureBar(multitask);
          showGestureBar();
          home.inert = true; // o alternador continua cobrindo a home
        }
      }

      setTimeout(() => {
        renderMultitask();
      }, 250);
    }

    const upscale = document.querySelector('.up.scale');
    const downscale = document.querySelector('.down.scale');
    const iphone = document.querySelector('.iphone');

    /* O padrão vem do CSS (--scale). O fallback repete o mesmo 0.9 do CSS —
       antes era 1, e qualquer falha na leitura mudava o zoom silenciosamente. */
    const cssScale = parseFloat(getComputedStyle(iphone).getPropertyValue('--scale'));
    const SCALE_DEFAULT = Number.isFinite(cssScale) ? cssScale : 0.9;
    const SCALE_MIN = 0.3;        // 0.1 deixava o aparelho com 42x91px
    const VIEWPORT_PADDING = 32;  // respiro entre o aparelho e a borda

    /* offsetHeight é a altura de layout (o transform não a altera), então o
       valor acompanha o CSS sozinho — antes era um 908 fixo que mentiria se
       a altura do aparelho mudasse. */
    const PHONE_HEIGHT = iphone.offsetHeight;

    let userAdjustedZoom = false;

    /* Encaixa o aparelho no viewport na carga: em telas baixas (ex.: 768px) os
       817px do mockup em 0.9 eram cortados e a barra de gesto ficava fora da
       área visível. Em telas altas o resultado continua 0.9. */
    function fitScale() {
      const available = window.innerHeight - VIEWPORT_PADDING;
      const fitted = Math.min(SCALE_DEFAULT, available / PHONE_HEIGHT);
      // floor para nunca ultrapassar o espaço disponível (arredondar para cima estourava 4px)
      return Math.floor(Math.max(SCALE_MIN, fitted) * 100) / 100;
    }

    function applyScale(next) {
      scale = Math.max(SCALE_MIN, next);
      iphone.style.setProperty('--scale', scale);
    }

    let scale = fitScale();

    // aplica o encaixe antes da primeira pintura: sem animação de zoom na carga
    iphone.style.transition = 'none';
    applyScale(scale);
    requestAnimationFrame(() => {
      iphone.style.transition = '';
    });

    function setScale(delta) {
      userAdjustedZoom = true;
      applyScale(scale + delta);
    }

    // reencaixa só enquanto o usuário não escolheu um zoom manualmente
    window.addEventListener('resize', () => {
      if (!userAdjustedZoom) applyScale(fitScale());
    });

    upscale.addEventListener('click', () => {
      setScale(+0.1);
    });

    downscale.addEventListener('click', () => {
      setScale(-0.1);
    });
  </script>

  <script>
    let batteryLevel = 100;

    /* Dono único do nível da bateria: todo caminho que altera o nível passa
       por aqui, então preenchimento, classe .low e desligamento em 0% nunca
       saem de sincronia (antes a classe e o OFF ficavam só no timer). */
    function setBatteryLevel(level) {
      batteryLevel = Math.max(0, Math.min(100, level));

      battery.style.setProperty('--level', `${batteryLevel}%`);
      battery.classList.toggle('low', batteryLevel <= 20);

      // bateria zerada desliga o aparelho (OFF é uma transição válida)
      if (batteryLevel === 0) {
        transition(STATES.OFF);
      }

      return batteryLevel;
    }

    function decreaseBatteryLevel() {
      if (batteryLevel === 0) return;

      setBatteryLevel(batteryLevel - 1);
    }

    setInterval(() => {
      // sinal e Wi-Fi variam independentemente do nível da bateria
      const signalLevel = Math.floor(Math.random() * 4) + 1;
      const wifiLevel = Math.floor(Math.random() * 3) + 1;
      signalBarsIcon.dataset.level = signalLevel;
      wifiSignalIcon.dataset.level = wifiLevel;

      if (batteryLevel === 0) return;

      // a descarga continua dormindo ou desligado: é a demonstração do mockup
      decreaseBatteryLevel();
    }, 60_000); // 1 min
  </script>
