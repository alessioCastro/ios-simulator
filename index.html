  <script>
    /* =========================
   FSM - ESTADOS DO SISTEMA
========================= */
    const STATES = {
      OFF: 'OFF',
      BOOTING: 'BOOTING',
      LOCKED_AWAKE: 'LOCKED_AWAKE',
      LOCKED_SLEEP: 'LOCKED_SLEEP',
      UNLOCKING: 'UNLOCKING',
      UNLOCKED: 'UNLOCKED'
    };

    let currentState = STATES.LOCKED_SLEEP;

    /* =========================
       ELEMENTOS
    ========================= */
    const powerButton = document.querySelector('.button.power');
    const volumeUpButton = document.querySelector('.button.vol-up');
    const volumeDownButton = document.querySelector('.button.vol-down');
    const volumeHud = document.querySelector('.volume-hud');
    const volumeLevel = document.querySelector('.volume-level');
    const bootScreen = document.querySelector('.boot-screen');
    const lockscreen = document.querySelector('.lockscreen');
    const lockscreenContent = document.querySelector('.lockscreen-content');
    const sleepScreen = document.querySelector('.sleep-screen');
    const screen = document.querySelector('.screen');
    const dynamicIsland = document.querySelector('.dynamic-island');
    const signalBarsIcon = document.querySelector('.signal-icon');
    const wifiSignalIcon = document.querySelector('.wifi-icon');
    const battery = document.querySelector('.battery');
    const home = document.querySelector('.home');
    const gestureBar = document.querySelector('.gesture-bar');
    const appContainerEl = document.querySelector('.app-container');
    const multitask = document.querySelector('.multitask');
    const appCards = document.querySelector('.app-cards');
    const audio = document.querySelector('audio');
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;

    let volume = 50;
    let audioCtx = null;
    let audioGain = null;

    function applyVolume() {
      if (audioGain) audioGain.gain.value = volume * 0.01;
    }

    /* O contexto só pode ser criado/retomado a partir de um gesto do usuário.
       Antes ele era criado no load (fica suspenso) e o audio.play() rejeitava
       sem tratamento — o erro estourava no console. */
    function initAudio() {
      if (audioCtx || !AudioContextClass) return;

      try {
        audioCtx = new AudioContextClass();
        audioGain = audioCtx.createGain();
        audioCtx.createMediaElementSource(audio)
          .connect(audioGain)
          .connect(audioCtx.destination);

        applyVolume();
      } catch (err) {
        console.warn('Áudio indisponível:', err);
        audioCtx = null;
        audioGain = null;
      }
    }

    async function startAudio() {
      initAudio();
      if (!audioCtx) return;

      try {
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        applyVolume();

        if (audio.paused) await audio.play();
      } catch (err) {
        // autoplay bloqueado ou audio.mp3 ausente: o mockup segue funcionando sem som
      }
    }

    /* =========================
       FSM CORE
    ========================= */
    const TRANSITIONS = {
      OFF: [STATES.BOOTING],
      BOOTING: [STATES.LOCKED_AWAKE],
      LOCKED_AWAKE: [STATES.LOCKED_SLEEP, STATES.UNLOCKING, STATES.OFF],
      LOCKED_SLEEP: [STATES.LOCKED_AWAKE, STATES.OFF],
      UNLOCKING: [STATES.UNLOCKED],
      UNLOCKED: [STATES.LOCKED_SLEEP, STATES.OFF]
    };

    function transition(to) {
      if (currentState === to) return;

      // o estado OFF era inalcançável: nenhum estado aceitava ir para ele,
      // então a bateria em 0 não desligava nada e o long press nunca fazia sentido
      const allowed = TRANSITIONS[currentState] || [];

      if (!allowed.includes(to)) {
        console.warn(`FSM: transição inválida ${currentState} → ${to}`);
        return;
      }

      exitState(currentState);
      currentState = to;
      enterState(to);
    }

    /* =========================
       RESET DO APP ABERTO
    ========================= */
    function resetAppView() {
      appContainerEl.classList.remove('active');
      appContainerEl.classList.add('hidden');
    }

    /* =========================
       EXIT STATE
    ========================= */
    function exitState(state) {
      switch (state) {

        case STATES.LOCKED_AWAKE:
          lockscreenContent.style.transition = '';
          lockscreenContent.style.transform = '';
          break;

        case STATES.UNLOCKED:
          resetAppView();
          if (typeof resetMultitask === 'function') resetMultitask();
          home.classList.remove('active');
          home.classList.add('hidden');
          gestureBar.classList.remove('active', 'pull');
          gestureBar.classList.add('hidden');
          break;

      }
    }

    /* =========================
       ENTER STATE
    ========================= */
    function enterState(state) {
      switch (state) {

        case STATES.BOOTING:
          boot();
          break;

        case STATES.LOCKED_AWAKE:
          // 1. Apaga tela de sleep IMEDIATAMENTE
          sleepScreen.classList.remove('active');
          sleepScreen.classList.add('hidden');

          // 2. Garante que home/app/multitarefa não estejam visíveis
          resetAppView();
          if (typeof resetMultitask === 'function') resetMultitask();
          home.classList.remove('active');
          home.classList.add('hidden');

          // 3. Restaura lockscreen
          lockscreen.classList.remove('hidden');
          lockscreenContent.style.transition = 'none';
          lockscreenContent.style.transform = 'translateY(0)';

          dynamicIsland.classList.remove('hidden');
          gestureBar.classList.remove('hidden');

          requestAnimationFrame(() => {
            dynamicIsland.classList.add('active');
            lockscreen.classList.add('active');
            gestureBar.classList.add('active');
            lockscreenContent.appendChild(gestureBar);
            lockscreenContent.insertBefore(dynamicIsland, lockscreenContent.firstChild);
          });
          break;

        case STATES.LOCKED_SLEEP:
          dynamicIsland.classList.remove('active');
          sleepScreen.classList.remove('hidden');
          requestAnimationFrame(() => {
            dynamicIsland.classList.add('hidden');
            sleepScreen.classList.add('active');
          });
          break;

        case STATES.UNLOCKING:
          lockscreenContent.style.transition =
            'transform 0.35s cubic-bezier(.2,.6,.3,1)';
          lockscreenContent.style.transform = 'translateY(-100%)';

          setTimeout(() => {
            transition(STATES.UNLOCKED);
          }, 400);
          break;

        case STATES.UNLOCKED:
          lockscreen.classList.add('hidden');
          lockscreen.classList.remove('active');

          // garante que nenhum app/multitarefa fique "preso" por cima da home
          resetAppView();
          if (typeof resetMultitask === 'function') resetMultitask();

          home.classList.remove('hidden');
          gestureBar.classList.remove('active');
          gestureBar.classList.add('hidden');

          dynamicIsland.classList.add('active');
          dynamicIsland.classList.remove('hidden');
          home.insertBefore(dynamicIsland, home.firstChild);
          requestAnimationFrame(() => {
            home.classList.add('active');
          });
          break;

        case STATES.OFF:
          resetAppView();
          if (typeof resetMultitask === 'function') resetMultitask();

          lockscreen.classList.remove('active');
          lockscreen.classList.add('hidden');
          home.classList.remove('active');
          home.classList.add('hidden');
          bootScreen.classList.remove('active');
          bootScreen.classList.add('hidden');
          sleepScreen.classList.remove('active');
          sleepScreen.classList.add('hidden');
          dynamicIsland.classList.remove('active');
          dynamicIsland.classList.add('hidden');
          gestureBar.classList.remove('active', 'pull');
          gestureBar.classList.add('hidden');
          volumeHud.classList.remove('active');
          volumeHud.classList.add('hidden');
          lockscreenContent.style.transition = '';
          lockscreenContent.style.transform = '';
          break;
      }
    }

    /* =========================
       BOOT
    ========================= */
    function boot() {
      bootScreen.classList.remove('hidden');

      setTimeout(() => {
        bootScreen.classList.add('active');
      }, 200);

      setTimeout(() => {
        bootScreen.classList.remove('active');

        setTimeout(() => {
          bootScreen.classList.add('hidden');
          transition(STATES.LOCKED_AWAKE);
        }, 1200);

      }, 4200);
    }

    /* =========================
       POWER BUTTON (POINTER)
    ========================= */
    let pressTimer = null;
    let isPressing = false;

    powerButton.addEventListener('pointerdown', onPowerPressStart);
    powerButton.addEventListener('pointerup', onPowerPressEnd);
    powerButton.addEventListener('pointercancel', resetPowerPress);
    // se o navegador perder a captura do ponteiro, libera o botão
    powerButton.addEventListener('lostpointercapture', resetPowerPress);

    function onPowerPressStart(e) {
      if (isPressing) return;
      isPressing = true;

      // captura o ponteiro: sem isso, soltar o mouse fora do botão deixava
      // isPressing travado em true e o botão parava de responder
      if (e && e.pointerId !== undefined) {
        try {
          powerButton.setPointerCapture(e.pointerId);
        } catch (err) { /* ignore */ }
      }

      pressTimer = setTimeout(() => {
        pressTimer = null;
        onPowerLongPress();
      }, 800);

      // não bloqueia o fluxo do clique; falhas de autoplay são ignoradas
      startAudio();
    }

    function onPowerPressEnd() {
      if (!isPressing) return;

      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
        onPowerShortPress();
      }

      isPressing = false;
    }

    function resetPowerPress() {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      isPressing = false;
    }

    function onPowerLongPress() {
      if (currentState === STATES.OFF) {
        // aparelho desligado → liga
        transition(STATES.BOOTING);
      } else if (
        currentState === STATES.LOCKED_AWAKE ||
        currentState === STATES.LOCKED_SLEEP ||
        currentState === STATES.UNLOCKED
      ) {
        // aparelho ligado → desliga (torna o estado OFF alcançável)
        transition(STATES.OFF);
      }
    }

    function onPowerShortPress() {
      if (currentState === STATES.LOCKED_AWAKE) {
        transition(STATES.LOCKED_SLEEP);
      } else if (currentState === STATES.LOCKED_SLEEP) {
        transition(STATES.LOCKED_AWAKE);
      } else if (currentState === STATES.UNLOCKED) {
        transition(STATES.LOCKED_SLEEP);
      }
    }

    /* =========================
       SWIPE UP (LOCKSCREEN)
    ========================= */
    let startY = 0;
    let currentY = 0;
    let isDragging = false;
    const swipeThreshold = 380;

    lockscreen.addEventListener('pointerdown', swipeStart);
    lockscreen.addEventListener('pointermove', swipeMove);
    lockscreen.addEventListener('pointerup', swipeEnd);
    lockscreen.addEventListener('pointercancel', swipeCancel);

    function swipeStart(e) {
      if (currentState !== STATES.LOCKED_AWAKE) return;

      isDragging = true;
      startY = e.clientY;
      currentY = startY;

      lockscreenContent.style.transition = 'none';
      try {
        lockscreen.setPointerCapture(e.pointerId); // ESSENCIAL no desktop
      } catch (err) { /* captura indisponível: o arrasto continua pelo bubbling */ }
    }

    function swipeMove(e) {
      if (!isDragging) return;
      if (currentState !== STATES.LOCKED_AWAKE) return;

      currentY = e.clientY;
      const delta = currentY - startY;

      if (delta > 0) return;

      lockscreenContent.style.transform = `translateY(${delta}px)`;
    }

    function swipeEnd(e) {
      if (!isDragging) return;

      isDragging = false;

      if (lockscreen.hasPointerCapture(e.pointerId)) {
        lockscreen.releasePointerCapture(e.pointerId);
      }

      if (currentState !== STATES.LOCKED_AWAKE) return;

      const delta = currentY - startY;

      lockscreenContent.style.transition =
        'transform 0.35s cubic-bezier(.2,.6,.3,1)';

      if (delta < -swipeThreshold) {
        transition(STATES.UNLOCKING);
      } else {
        lockscreenContent.style.transform = 'translateY(0)';
      }
    }

    function swipeCancel(e) {
      if (!isDragging) return;

      isDragging = false;

      if (e && lockscreen.hasPointerCapture(e.pointerId)) {
        lockscreen.releasePointerCapture(e.pointerId);
      }

      lockscreenContent.style.transition = 'transform 0.3s ease';
      lockscreenContent.style.transform = 'translateY(0)';
    }

  </script>

  <script>
    /* =========================
   LOCKSCREEN TIME
========================= */
    const timeEl = document.querySelector('.lockscreen-time');
    const dateEl = document.querySelector('.lockscreen-date');

    function updateTime() {
      const now = new Date();

      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');

      const weekday = now
        .toLocaleDateString('pt-BR', { weekday: 'short' })
        .replace('.', '');

      const month = now
        .toLocaleDateString('pt-BR', { month: 'short' })
        .replace('.', '');

      const day = now.getDate();

      const formattedWeekday =
        weekday[0].toUpperCase() + weekday.slice(1) + '.';

      const formattedMonth = month.toLowerCase() + '.';

      timeEl.textContent = `${hours}:${minutes}`;
      dateEl.textContent = `${formattedWeekday} ${day} de ${formattedMonth}`;
    }

    // inicial
    updateTime();

    // atualiza só quando faz sentido (1x/min)
    setInterval(updateTime, 60000);
  </script>

  <script>
    let volumeTimeout = null;

    function showVolumeHud() {
      volumeLevel.style.height = `${volume}%`;

      volumeHud.classList.remove('hidden');
      volumeHud.classList.add('active');

      clearTimeout(volumeTimeout);
      volumeTimeout = setTimeout(() => {
        volumeHud.classList.remove('active');
        volumeTimeout = setTimeout(() => {
          volumeHud.classList.add('hidden');
        }, 250);
      }, 1200);
    }

    function volumeUp() {
      if (currentState === STATES.LOCKED_SLEEP || currentState === STATES.OFF) return;
      volume = Math.min(100, volume + 5);
      showVolumeHud();

      applyVolume();
    }

    function volumeDown() {
      if (currentState === STATES.LOCKED_SLEEP || currentState === STATES.OFF) return;
      volume = Math.max(0, volume - 5);
      showVolumeHud();

      applyVolume();
    }

    volumeUpButton.addEventListener('click', volumeUp);
    volumeDownButton.addEventListener('click', volumeDown);
  </script>

  <script>
    const apps = document.querySelectorAll('.app');
    const appContainer = document.querySelector('.app-container');
    const appTitle = document.querySelector('.app-title');

    function openApp(name) {
      if (currentState !== STATES.UNLOCKED) return;

      if (multitaskActive) closeMultitask();

      appTitle.textContent = name;

      home.classList.remove('active');

      appContainer.classList.remove('hidden');
      requestAnimationFrame(() => {
        appContainer.classList.add('active');

        // status bar também visível dentro do app
        appContainer.appendChild(dynamicIsland);

        gestureBar.classList.remove('hidden');
        gestureBar.classList.add('active');
        appContainer.appendChild(gestureBar);

        setTimeout(() => {
          gestureBar.classList.add('hidden');
          gestureBar.classList.remove('active');
        }, 1000);
      });

      if (!openApps.includes(name)) {
        openApps.push(name);
      }
    }

    function closeApp() {
      // devolve a status bar para a home
      home.insertBefore(dynamicIsland, home.firstChild);

      gestureBar.classList.remove('active', 'pull');
      gestureBar.classList.add('hidden');

      // anima o app "encolhendo" em direção ao ícone antes de esconder
      appContainer.classList.remove('active');
      setTimeout(() => {
        if (appContainer.classList.contains('active')) return;
        appContainer.classList.add('hidden');
        appContainer.style.transform = '';
        appContainer.style.opacity = '';
        appContainer.style.transition = '';
      }, 360);

      if (currentState === STATES.UNLOCKED) {
        home.classList.remove('hidden');
        home.classList.add('active');
      }
    }

    apps.forEach(app => {
      app.addEventListener('click', () => {
        openApp(app.dataset.app);
      });
    });
  </script>

  <script>
    /* =========================
       GESTO DA BARRA INFERIOR (iOS)
       - deslizar para cima e soltar rápido  → fecha o app (volta pra home)
       - deslizar para cima e pausar         → alternador de tarefas
       Segurar parado NÃO abre o alternador (isso não existe no iOS).
    ========================= */
    const SWIPE_CLOSE_DISTANCE = 60;  // px para cima que confirmam o swipe
    const SWIPE_PAUSE_MS = 220;       // pausa após subir que abre o alternador

    let gestureStartY = 0;
    let gestureActive = false;
    let gestureHoldTimer = null;
    let gestureOpenedMultitask = false;
    let gestureMoved = false;

    function showGestureBar() {
      gestureBar.classList.remove('hidden');
      gestureBar.classList.add('active');
    }

    function hideGestureBar(delay = 0) {
      clearTimeout(gestureBarHideTimer);
      gestureBarHideTimer = setTimeout(() => {
        if (gestureActive) return;
        gestureBar.classList.remove('active', 'pull');
        gestureBar.classList.add('hidden');
      }, delay);
    }

    let gestureBarHideTimer = null;

    function resetAppDrag() {
      appContainer.style.transition = '';
      appContainer.style.transform = '';
      appContainer.style.opacity = '';
    }

    screen.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (currentState !== STATES.UNLOCKED) return;
      if (multitaskActive) return; // o overlay do multitarefa está por cima

      const y = e.clientY;
      const rect = screen.getBoundingClientRect();

      if (y <= rect.bottom - 40) return; // fora da zona da barra inferior

      gestureStartY = y;
      gestureActive = true;
      gestureMoved = false;
      gestureOpenedMultitask = false;

      showGestureBar();

      // o app acompanha o dedo sem transição
      appContainer.style.transition = 'none';

      try {
        screen.setPointerCapture(e.pointerId); // ESSENCIAL no desktop
      } catch (err) { /* captura indisponível: o arrasto continua pelo bubbling */ }
    });

    screen.addEventListener('pointermove', e => {
      if (!gestureActive) return;
      if (e.pointerType === 'mouse' && e.buttons !== 1) return;

      const delta = e.clientY - gestureStartY;
      if (delta >= 0) return; // só interessa arrastar para cima

      const up = -delta;

      if (up > 8) {
        gestureMoved = true;
        gestureBar.classList.add('pull');
      }

      // app encolhendo em direção ao ícone, seguindo o dedo
      if (appContainer.classList.contains('active')) {
        const progress = Math.min(1, up / 320);
        appContainer.style.transform =
          `translateY(${-up * 0.25}px) scale(${1 - 0.12 * progress})`;
        appContainer.style.opacity = String(1 - 0.2 * progress);
      }

      // subiu e pausou → alternador de tarefas (também na tela inicial)
      if (gestureMoved && !gestureOpenedMultitask) {
        clearTimeout(gestureHoldTimer);
        gestureHoldTimer = setTimeout(() => {
          if (!gestureActive) return;

          gestureOpenedMultitask = true;
          openMultitask();
        }, SWIPE_PAUSE_MS);
      }
    });

    screen.addEventListener('pointerup', e => {
      if (!gestureActive) return;

      clearTimeout(gestureHoldTimer);
      gestureBar.classList.remove('pull');
      gestureActive = false;

      if (screen.hasPointerCapture(e.pointerId)) {
        screen.releasePointerCapture(e.pointerId);
      }

      const delta = e.clientY - gestureStartY;
      const appWasOpen = appContainer.classList.contains('active');

      // devolve o controle da animação ao CSS
      resetAppDrag();

      if (gestureOpenedMultitask) return;

      // swipe rápido para cima → fecha o app
      if (appWasOpen && delta < -SWIPE_CLOSE_DISTANCE) {
        closeApp();
        return;
      }

      hideGestureBar(600);
    });

    screen.addEventListener('pointercancel', () => {
      clearTimeout(gestureHoldTimer);
      gestureBar.classList.remove('pull');
      gestureActive = false;
      resetAppDrag();
      hideGestureBar(600);
    });

  </script>

  <script>
    let openApps = [];
    let multitaskActive = false;

    function openMultitask() {
      if (currentState !== STATES.UNLOCKED) return;
      if (multitaskActive) return;

      multitaskActive = true;
      renderMultitask();

      // status bar visível também no alternador
      multitask.insertBefore(dynamicIsland, multitask.firstChild);

      multitask.classList.remove('hidden');
      requestAnimationFrame(() => {
        multitask.classList.add('active');
      });
    }

    function closeMultitask() {
      if (!multitaskActive) return;

      multitaskActive = false;
      multitask.classList.remove('active');

      // devolve a status bar para o app (se aberto) ou para a home
      if (appContainer.classList.contains('active')) {
        appContainer.appendChild(dynamicIsland);
      } else {
        home.insertBefore(dynamicIsland, home.firstChild);
      }

      setTimeout(() => {
        if (!multitaskActive) multitask.classList.add('hidden');
      }, 300);
    }

    // usado pelo FSM ao bloquear/desligar o aparelho
    function resetMultitask() {
      multitaskActive = false;
      multitask.classList.remove('active');
      multitask.classList.add('hidden');
      appCards.innerHTML = '';
      home.insertBefore(dynamicIsland, home.firstChild);
    }

    // antes não havia como fechar o multitarefa sem abrir um app:
    // tocar no fundo (ou ESC) agora fecha
    multitask.addEventListener('click', e => {
      if (!e.target.closest('.app-card')) closeMultitask();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && multitaskActive) closeMultitask();
    });

    function renderMultitask() {
      appCards.innerHTML = '';

      openApps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'app-card';
        card.textContent = app;

        // evita que o "swipe para cima" (fechar card) dispare também o clique,
        // que reabria o app que acabou de ser fechado
        let swiped = false;

        card.addEventListener('click', () => {
          if (swiped) {
            swiped = false;
            return;
          }

          closeMultitask();
          openApp(app);
        });

        card.addEventListener('pointerdown', e => {
          const startY = e.clientY;
          swiped = false;

          try {
            card.setPointerCapture(e.pointerId);
          } catch (err) { /* ignore */ }

          card.addEventListener('pointerup', ev => {
            const delta = ev.clientY - startY;
            if (delta < -80) {
              swiped = true;
              closeAppFromMultitask(app, card);
            }
          }, { once: true });
        });

        appCards.appendChild(card);
      });
    }

    function closeAppFromMultitask(app, card) {
      openApps = openApps.filter(a => a !== app);
      card.style.opacity = '0';
      card.style.transform = 'translateY(-100px)';

      setTimeout(() => {
        renderMultitask();
      }, 250);
    }

    const upscale = document.querySelector('.up.scale');
    const downscale = document.querySelector('.down.scale');
    const iphone = document.querySelector('.iphone');
    let scale = parseFloat(getComputedStyle(iphone).getPropertyValue('--scale')) || 1;

    function setScale(delta) {
      scale = Math.max(0.1, scale + delta); // evita scale inválido
      iphone.style.setProperty('--scale', scale);
    }

    upscale.addEventListener('click', () => {
      setScale(+0.1);
      //iphone.style.transform = `scale()`;
    });

    downscale.addEventListener('click', () => {
      setScale(-0.1);
      //iphone.style.transform = `scale()`;
    });
  </script>

  <script>
    const t = {
      ms: v => v,
      s: v => v * 1_000,
      min: v => v * 60_000,
      h: v => v * 3_600_000
    };

    let batteryLevel = 100;

    function increaseBatteryLevel() {
      if (batteryLevel == 100) return;

      batteryLevel = Math.max(0, Math.min(100, batteryLevel + 1));

      battery.style.setProperty('--level', `${batteryLevel}%`);
    }

    function decreaseBatteryLevel() {
      if (batteryLevel == 0) return;

      batteryLevel = Math.max(0, Math.min(100, batteryLevel - 1));

      battery.style.setProperty('--level', `${batteryLevel}%`);
    }

    setInterval(() => {
      // sinal e Wi-Fi variam independentemente do nível da bateria
      const signalLevel = Math.floor(Math.random() * 4) + 1;
      const wifiLevel = Math.floor(Math.random() * 3) + 1;
      signalBarsIcon.dataset.level = signalLevel;
      wifiSignalIcon.dataset.level = wifiLevel;

      if (batteryLevel === 0) return;

      decreaseBatteryLevel();
      battery.classList.toggle('low', batteryLevel <= 20);

      // bateria zerada desliga o aparelho (OFF agora é uma transição válida)
      if (batteryLevel === 0) {
        transition(STATES.OFF);
      }
    }, t.s(60));
  </script>
